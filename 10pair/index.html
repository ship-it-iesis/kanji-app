:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Maru Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;touch-action:manipulation}
#app{max-width:980px;margin:0 auto;min-height:100%;padding:12px 14px 18px;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;gap:12px}
.screen.on{display:flex}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-size:24px;font-weight:700;white-space:nowrap}
.btn{min-height:64px;min-width:64px;border:3px solid var(--line);background:var(--card);border-radius:18px;font-size:28px;font-weight:700;padding:8px 22px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:48px;font-size:20px;padding:4px 14px}
.btn[disabled]{opacity:.45;cursor:default}
.iconbtn{min-width:48px;min-height:48px;border:2px solid var(--line);background:var(--card);border-radius:14px;font-size:24px;cursor:pointer}

.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.hero .rabbit{font-size:clamp(90px,18vw,150px);line-height:1}
.hero .sub{font-size:24px}
.menu{display:flex;flex-direction:column;align-items:center;gap:10px}
.menu .play{width:min(460px,80%)}
.menu4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
@media (max-width:720px){.menu4{grid-template-columns:repeat(2,1fr)}}
.imgbtn{border:0;background:none;padding:0;cursor:pointer;display:block}
.imgbtn img{display:block;width:100%;height:auto;pointer-events:none}
.imgbtn:active{transform:scale(.96)}
.hero .logo{width:min(560px,86%);height:auto;display:block}

/* play */
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:22px;height:22px;border-radius:50%;background:#e5dccb}
.dot.now{background:var(--accent)}
.dot.done{background:var(--c2);opacity:.6}
.qcard{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:230px;justify-content:center}
.prompt{font-size:clamp(22px,3.6vw,30px);font-weight:700;text-align:center}
.eq{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,18px);font-size:clamp(56px,11vw,100px);font-weight:800;line-height:1.1}
.eq .op{font-size:.6em}
.eq .q{display:inline-flex;align-items:center;justify-content:center;min-width:1.3em;height:1.3em;border:5px solid #d6d6d6;border-radius:18px;color:#b5b5b5}
.eq .q.ok{border:5px solid var(--ok);color:var(--ok);background:var(--ok-bg)}
.frame{display:grid;grid-template-columns:repeat(5,clamp(34px,7vw,56px));gap:8px;justify-content:center}
.frame i{width:clamp(34px,7vw,56px);height:clamp(34px,7vw,56px);border-radius:50%;display:block;position:relative}
.frame i.c1{background:var(--c1)}
.frame i.c2{background:var(--c2)}
.frame i.c0{background:transparent;visibility:hidden}
.frame i.cx{background:#d9d2c5}
.frame i.cx::after{content:"×";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:clamp(24px,5vw,40px);color:#7a6f5f}
.hint{display:none;background:var(--ng-bg);border:3px solid #f0cf9c;border-radius:20px;padding:10px 14px;text-align:center;flex-direction:column;align-items:center;gap:6px}
.hint.on{display:flex}
.hint .ht{font-size:clamp(24px,4.4vw,34px);font-weight:800;color:var(--ng)}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
@media (max-width:720px){.pad{grid-template-columns:repeat(5,1fr)}}
.pad .btn{font-size:clamp(36px,7vw,56px);min-height:clamp(72px,12vh,100px);padding:0;min-width:0}
.pad .btn.ng{background:var(--ng-bg);border-color:#f0cf9c;color:#c9b08a;opacity:.7}
.pad .btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.praise{height:44px;text-align:center;font-size:32px;font-weight:800;color:var(--ok)}

/* result */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.res .big{font-size:clamp(34px,7vw,56px);font-weight:800}
.res .time{font-size:clamp(28px,5vw,40px);font-weight:700}
.stars{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:90px}
.stars span{font-size:clamp(48px,9vw,78px);opacity:0;transform:scale(.3);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.stars span.in{opacity:1;transform:scale(1)}
.stars span.gray{filter:grayscale(1) brightness(.8);}
.stars span.gray.in{opacity:.6}
.res .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.note{font-size:22px}

/* record */
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tabs .btn.small{font-size:22px;min-height:52px}
.chartbox{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:8px;min-height:260px;display:flex;align-items:center;justify-content:center}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox .none{font-size:26px;font-weight:700;padding:30px;text-align:center}

/* shop */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.item .em{font-size:60px;line-height:1.1}
.item .nm{font-size:22px;font-weight:700}
.item .pr{font-size:22px;font-weight:800}
.item.have{background:var(--ok-bg);border-color:#a9d9b8}
.item .btn{min-height:52px;font-size:22px;padding:2px 14px}

/* house */
.room{position:relative;width:100%;max-width:820px;margin:0 auto;aspect-ratio:10/7;border:4px solid #d9b98a;border-radius:22px;overflow:hidden;touch-action:none}
.room{background-size:100% 100%;background-repeat:no-repeat;background-color:#fdeccb}
.room .it{position:absolute;line-height:1;cursor:grab;touch-action:none;padding:2px;-webkit-user-select:none;user-select:none}
.room .it.pic{padding:0}
.room .it.pic img{width:100%;height:auto;display:block;pointer-events:none}
.room .it.wall{transform:translate(-50%,-50%)}
.room .it.floor{transform:translate(-50%,-100%)}
.room .it.floor::after{content:"";position:absolute;left:10%;right:10%;bottom:-2%;height:12%;border-radius:50%;background:rgba(80,50,20,.22);z-index:-1}
.room .it.drag{cursor:grabbing;filter:drop-shadow(0 8px 6px rgba(60,40,10,.35))}
.room .it.floor.drag{transform:translate(-50%,-100%) scale(1.08)}
.room .it.wall.drag{transform:translate(-50%,-50%) scale(1.08)}
.empty{text-align:center;font-size:22px}

/* dialog */
.ov{position:fixed;inset:0;background:rgba(60,45,30,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
.dlg{background:#fff;border-radius:24px;padding:22px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.dlg .t{font-size:28px;font-weight:800}
.dlg .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.si{height:1.15em;width:auto;vertical-align:-.2em;display:inline-block}
.ic{height:1.3em;width:auto;vertical-align:-.25em;margin-right:.2em;display:inline-block}
.stars .si{height:auto;width:clamp(48px,9vw,78px)}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.stars span{transition:none}}
@media (max-height:620px){.qcard{min-height:170px}.hero .rabbit{font-size:80px}}
</style>
</head>
<body>
<div id="app">

  <!-- ホーム -->
  <section id="home" class="screen on">
    <div class="top">
      <div class="pill"><i class="sti"></i> <span id="homeStars">0</span></div>
      <div style="display:flex;gap:8px">
        <button class="iconbtn" id="muteBtn" aria-label="おと">🔊</button>
        <button class="iconbtn" id="gearBtn" aria-label="せってい">⚙️</button>
      </div>
    </div>
    <div class="hero">
      <div class="rabbit" id="homeRabbit">🐰</div>
      <img class="logo" id="titleLogo" alt="10の ペア ゲーム" draggable="false">
    </div>
    <div class="menu">
      <button class="imgbtn play" id="playBtn" aria-label="あそぶ"></button>
      <div class="menu4">
        <button class="imgbtn" id="shopBtn" aria-label="おみせ"></button>
        <button class="imgbtn" id="houseBtn" aria-label="おうち"></button>
        <button class="imgbtn" id="recBtn" aria-label="きろく"></button>
        <button class="imgbtn" id="howBtn" aria-label="ルール"></button>
      </div>
    </div>
  </section>

  <!-- プレイ -->
  <section id="play" class="screen">
    <div class="top">
      <button class="iconbtn" id="quitBtn" aria-label="もどる" data-ic="house"></button>
      <div class="dots" id="dots"></div>
      <button class="iconbtn" id="muteBtn2" aria-label="おと">🔊</button>
    </div>
    <div class="qcard" id="qcard"></div>
    <div class="hint" id="hint"><div style="display:flex;align-items:center;gap:12px"><span id="hintRabbit"></span><div class="ht" id="hintText"></div></div><div class="frame" id="hintFrame"></div></div>
    <div class="praise" id="praise"></div>
    <div class="pad" id="pad"></div>
  </section>

  <!-- けっか -->
  <section id="result" class="screen">
    <div class="res">
      <div id="resRabbit"></div>
      <div class="big" id="resTitle">できた！</div>
      <div class="time" id="resTime"></div>
      <div class="stars" id="resStars"></div>
      <div class="note" id="resNote"></div>
      <div class="row">
        <button class="btn primary" id="againBtn">もういちど</button>
        <button class="imgbtn" id="resShopBtn" aria-label="おみせ" style="width:190px"></button>
        <button class="imgbtn" id="resHouseBtn" aria-label="おうち" style="width:190px"></button>
        <button class="btn" id="resHomeBtn">もどる</button>
      </div>
    </div>
  </section>

  <!-- おみせ -->
  <section id="shop" class="screen">
    <div class="top">
      <button class="btn small" id="shopBack">← もどる</button>
      <div class="pill"><i class="sti"></i> <span id="shopStars">0</span></div>
    </div>
    <div class="prompt">ほしを つかって かぐを かおう</div>
    <div class="grid" id="shopGrid"></div>
  </section>

  <!-- きろく -->
  <section id="record" class="screen">
    <div class="top">
      <button class="btn small" id="recBack">← もどる</button>
      <div class="pill" data-ic="graph">きろく</div>
    </div>
    <div class="tabs" id="recTabs">
      <button class="btn small primary" data-r="10">さいきんの 10かい</button>
      <button class="btn small" data-r="week">1しゅうかん</button>
      <button class="btn small" data-r="all">ぜんぶ</button>
    </div>
    <div class="chartbox" id="chartBox"></div>
    <div class="empty" id="recNote"></div>
  </section>

  <!-- おうち -->
  <section id="house" class="screen">
    <div class="top">
      <button class="btn small" id="houseBack">← もどる</button>
      <div class="pill"><i class="sti"></i> <span id="houseStars">0</span></div>
    </div>
    <div class="room" id="room"><div class="fl"></div></div>
    <div class="empty" id="houseNote"></div>
    <div class="row" style="display:flex;justify-content:center;gap:12px">
      <button class="imgbtn" id="houseShop" aria-label="おみせ" style="width:190px"></button>
      <button class="btn" id="housePosReset">もとの ばしょ</button>
      <button class="imgbtn" id="housePlay" aria-label="あそぶ" style="width:230px"></button>
    </div>
  </section>
</div>

<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>

var ac=null;
function ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==="suspended"){ac.resume();}return ac;}
function tone(f,t,d,v){if(mem.mute)return;var a=ctx();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=f;
  var s=a.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v||.12,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.05);}
function sOk(){tone(784,0,.18);tone(1047,.1,.25);}
function sNg(){tone(300,0,.25,.07);}
function sStar(i){tone(660+i*90,0,.25,.1);}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function makeQuestions(){
  var nums;
  for(var tries=0;tries<200;tries++){
    nums=shuffle([1,2,3,4,5,6,7,8,9]);
    nums.push(1+Math.floor(Math.random()*9));
    nums=nums.slice(0,CFG.count);
    var okAdj=true;for(var k=1;k<nums.length;k++){if(nums[k]===nums[k-1]){okAdj=false;break;}}
    if(okAdj)break;
  }
  var types=shuffle(["pair","fill","block","pair","fill","block","pair","fill","block","fill"]).slice(0,CFG.count);
  var fills=["add1","add2","sub"];
  var qs=[];
  for(var i=0;i<nums.length;i++){
    var a=nums[i];
    var type=types[i];
    qs.push({a:a,ans:10-a,type:type,fill:type==="fill"?fills[Math.floor(Math.random()*3)]:null,missed:false});
  }
  return qs;
}
function frame(a,mode){ // mode: "add"=あか+あお / "sub"=ひく / "hide"=あか+てんせん
  var h="";for(var i=0;i<10;i++){var c;
    if(mode==="sub")c=i<a?"cx":"c2";
    else if(mode==="hide")c=i<a?"c1":"c0";
    else c=i<a?"c1":"c2";
    h+='<i class="'+c+'"></i>';}
  return h;}

var st=null;
function startGame(){
  ctx();
  st={qs:makeQuestions(),i:0,miss:0,start:0,locked:false};
  buildPad();
  buildDots();
  show("play");
  showQ();
}
function buildPad(){var h="";for(var n=1;n<=9;n++){h+='<button class="btn" data-n="'+n+'">'+n+'</button>';}
  $("pad").innerHTML=h;}
function buildDots(){var h="";for(var i=0;i<st.qs.length;i++)h+='<div class="dot" data-i="'+i+'"></div>';$("dots").innerHTML=h;}
function updateDots(){var d=$("dots").children;for(var i=0;i<d.length;i++){d[i].className="dot"+(i<st.i?" done":(i===st.i?" now":""));}}
function showQ(){
  var q=st.qs[st.i];st.locked=false;
  if(st.i===0)st.start=Date.now();
  updateDots();
  $("hint").classList.remove("on");$("praise").textContent="";
  var btns=$("pad").children;for(var b=0;b<btns.length;b++){btns[b].className="btn";btns[b].disabled=false;}
  var h="";
  if(q.type==="pair"){
    h='<div class="prompt">あわせて 10に なる かずは？</div><div class="eq"><span>'+q.a+'</span><span class="op">と</span><span class="q" id="qq">？</span></div><div class="prompt">あわせて 10</div>';
  }else if(q.type==="fill"){
    var e;
    if(q.fill==="add1")e='<span>'+q.a+'</span><span class="op">＋</span><span class="q" id="qq">？</span><span class="op">＝</span><span>10</span>';
    else if(q.fill==="add2")e='<span class="q" id="qq">？</span><span class="op">＋</span><span>'+q.a+'</span><span class="op">＝</span><span>10</span>';
    else e='<span>10</span><span class="op">－</span><span>'+q.a+'</span><span class="op">＝</span><span class="q" id="qq">？</span>';
    h='<div class="prompt">？に はいる かずは？</div><div class="eq">'+e+'</div>';
  }else{
    h='<div class="prompt">あかい まるが '+q.a+'こ。あと なんこで 10に なるかな？</div><div class="frame" id="qframe">'+frame(q.a,"hide")+'</div><div class="eq" style="font-size:clamp(40px,8vw,64px)"><span>'+q.a+'</span><span class="op">と</span><span class="q" id="qq">？</span></div>';
  }
  $("qcard").innerHTML=h;
}
function hintFor(q){
  $("hintRabbit").innerHTML=pic("usagi_kangaeru",72);
  var sub=(q.type==="fill"&&q.fill==="sub");
  var isBlock=(q.type==="block");
  var qf=$("qframe");if(qf)qf.innerHTML=frame(q.a,"add");   // おおいを とって あおい まるを みせる
  $("hintFrame").innerHTML=isBlock?"":frame(q.a,sub?"sub":"add");
  $("hintText").textContent=sub?("10から "+q.a+"を とると "+q.ans):(q.a+" と "+q.ans+" で 10");
  $("hint").classList.add("on");
}
function onPad(n,btn){
  if(!st||st.locked)return;
  var q=st.qs[st.i];
  if(n===q.ans){
    st.locked=true;
    btn.classList.add("ok");
    var qq=$("qq");if(qq){qq.textContent=n;qq.classList.add("ok","pop");}
    var f=$("qframe");if(f)f.innerHTML=frame(q.a,"add");
    $("praise").textContent="⭕ せいかい！";
    sOk();
    setTimeout(function(){
      st.i++;
      if(st.i>=st.qs.length){finish();}else{showQ();}
    },q.missed?1300:750);
  }else{
    if(!q.missed){q.missed=true;st.miss++;}
    btn.classList.add("ng");btn.disabled=true;
    sNg();
    hintFor(q);
    $("praise").textContent="";
  }
}

/* ===== けっか ===== */
function calcStars(sec,noMiss){
  var s=CFG.minStars;
  for(var i=0;i<CFG.timeStars.length;i++){if(sec<=CFG.timeStars[i][0]){s=CFG.timeStars[i][1];break;}}
  if(noMiss)s+=CFG.noMissBonus;
  return s;
}
function finish(){
  var sec=(Date.now()-st.start)/1000;
  var noMiss=st.miss===0;
  var stars=calcStars(sec,noMiss);
  mem.stars+=stars;mem.plays+=1;
  if(!mem.log)mem.log=[];mem.log.push({t:Date.now(),s:Math.round(sec*10)/10,k:stars});if(mem.log.length>500)mem.log=mem.log.slice(-500);
  var newBest=false;
  if(noMiss&&(mem.best==null||sec<mem.best)){mem.best=Math.round(sec*10)/10;newBest=true;}
  save();
  show("result");
  $("resRabbit").innerHTML=pic(stars>=2?"usagi_yorokobu":"usagi_futsu",150);
  $("resTitle").textContent=noMiss?"ぜんぶ いっぱつで できた！":"さいごまで できたね！";
  $("resTime").textContent="タイム "+sec.toFixed(1)+" びょう";
  $("resNote").textContent=(newBest?"🎉 ベストタイム こうしん！　":"")+"ほしを "+stars+"こ ゲット！（ぜんぶで "+mem.stars+"こ）";
  var box=$("resStars");box.innerHTML="";
  for(var i=0;i<3;i++){(function(i){var sp=document.createElement("span");sp.innerHTML=starImg(i<stars);
    box.appendChild(sp);
    setTimeout(function(){sp.classList.add("in");if(i<stars)sStar(i);},350+i*330);})(i);}
}

/* ===== おみせ ===== */
function renderShop(){
  $("shopStars").textContent=mem.stars;
  var h="";
  ITEMS.forEach(function(it){
    var have=mem.owned.indexOf(it.id)>=0;
    h+='<div class="item'+(have?' have':'')+'"><div class="em">'+thumb(it,72)+'</div><div class="nm">'+it.nm+'</div>';
    if(have)h+='<div class="pr">✅ もってる</div>';
    else{h+='<div class="pr">'+starImg()+' '+it.pr+'</div><button class="btn small" data-buy="'+it.id+'"'+(mem.stars<it.pr?' disabled':'')+'>かう</button>';}
    h+='</div>';
  });
  $("shopGrid").innerHTML=h;
}
function dialog(html){$("dlg").innerHTML=html;$("ov").classList.add("on");}
function closeDlg(){$("ov").classList.remove("on");}
function askBuy(id){
  var it=ITEMS.filter(function(x){return x.id===id})[0];if(!it)return;
  dialog('<div class="t">'+thumb(it,96)+'<br>'+it.nm+' を かう？</div><div class="prompt">'+starImg()+' '+it.pr+' こ つかうよ</div><div class="row"><button class="btn primary" data-yes="'+id+'">かう</button><button class="btn" data-no="1">やめる</button></div>');
}
function doBuy(id){
  var it=ITEMS.filter(function(x){return x.id===id})[0];
  if(!it||mem.owned.indexOf(id)>=0||mem.stars<it.pr){closeDlg();return;}
  mem.stars-=it.pr;mem.owned.push(id);save();sBuy();
  dialog('<div class="t pop">'+thumb(it,96)+'<br>おうちに おいたよ！</div><div class="row"><button class="btn primary" data-goto="house">おうちを みる</button><button class="btn" data-no="1">おみせに もどる</button></div>');
  renderShop();
}

/* ===== おうち ===== */
var ROOM_H=70,FY0=42.3,FY1=70,FYC=51.9,WX0=16.5; // へやの ざひょう：よこ100 × たて70。ゆかは y=42.3(おく)〜70(てまえ) // へやの ざひょう：よこ100 × たて70。ゆかは y=38(おく)〜70(てまえ)
function floorScale(y){return .55+.6*((y-FY0)/(FY1-FY0));}
function clampPos(it,x,y){
  if(it.pl==="wall"){x=Math.max(WX0+5,Math.min(100-WX0-5,x));y=Math.max(11,Math.min(40,y));}
  else{y=Math.max(FY0+2,Math.min(69,y));var m=Math.max(0,WX0*(FYC-y)/(FYC-FY0))+4;x=Math.max(m,Math.min(100-m,x));}
  return {x:x,y:y};}
function curPos(it){var q=mem.pos&&mem.pos[it.id];return q?clampPos(it,q.x,q.y):clampPos(it,it.x,it.y);}
function applyPos(el,it,q){
  var rw=$("room").clientWidth;
  if(it.img&&IMG[it.img]){var sc0=it.pl==="floor"?floorScale(q.y):1;el.style.width=(rw*it.w*sc0)+"px";}
  el.style.left=q.x+"%";el.style.top=(q.y/ROOM_H*100)+"%";
  var sc=it.pl==="floor"?floorScale(q.y):1;
  el.style.fontSize=(rw*it.s*sc)+"px";
  el.style.zIndex=it.pl==="wall"?1:Math.round(q.y*10);}
function sizeRoom(){var r=$("room");var kids=r.querySelectorAll(".it");
  for(var i=0;i<kids.length;i++){var it=kids[i]._it;if(it)applyPos(kids[i],it,curPos(it));}}
function renderHouse(){
  $("houseStars").textContent=mem.stars;
  var r=$("room");r.innerHTML="";r.style.backgroundImage="url("+BGIMG.room_bg+")";
  var all=[ME].concat(ITEMS.filter(function(it){return mem.owned.indexOf(it.id)>=0}));
  all.forEach(function(it){var d=document.createElement("div");d.className="it "+it.pl;if(it.img&&IMG[it.img]){d.innerHTML='<img src="'+IMG[it.img].d+'" alt="" draggable="false">';d.classList.add("pic");}else d.textContent=it.em;d._it=it;r.appendChild(d);applyPos(d,it,curPos(it));});
  sizeRoom();
  $("houseNote").textContent=(mem.owned.length?("かぐ "+mem.owned.length+" / "+ITEMS.length+"　"):"ゲームで ほしを あつめて、おうちを かざろう　")+"かぐを ゆびで うごかせるよ";
}
(function(){
  var cur=null,dx=0,dy=0;
  var room=$("room");
  room.addEventListener("pointerdown",function(e){
    var el=e.target.closest(".it");if(!el||!el._it)return;
    cur=el;el.classList.add("drag");
    var rc=room.getBoundingClientRect();
    var q=curPos(el._it);
    var px=(e.clientX-rc.left)/rc.width*100,py=(e.clientY-rc.top)/rc.height*ROOM_H;
    dx=q.x-px;dy=q.y-py;
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  room.addEventListener("pointermove",function(e){
    if(!cur)return;
    var rc=room.getBoundingClientRect();
    var px=(e.clientX-rc.left)/rc.width*100,py=(e.clientY-rc.top)/rc.height*ROOM_H;
    var q=clampPos(cur._it,px+dx,py+dy);
    applyPos(cur,cur._it,q);
    cur._pos=q;
  });
  function end(){
    if(!cur)return;
    cur.classList.remove("drag");
    if(cur._pos){if(!mem.pos)mem.pos={};mem.pos[cur._it.id]=cur._pos;save();}
    cur=null;
  }
  room.addEventListener("pointerup",end);
  room.addEventListener("pointercancel",end);
})();

/* ===== きろく ===== */
var recRange="10";
function renderRecord(){
  var tabs=$("recTabs").children;for(var i=0;i<tabs.length;i++){tabs[i].classList.toggle("primary",tabs[i].getAttribute("data-r")===recRange);}
  var log=mem.log||[],data;
  if(recRange==="10")data=log.slice(-10);
  else if(recRange==="week"){var lim=Date.now()-7*86400000;data=log.filter(function(r){return r.t>=lim;});}
  else data=log;
  var info="ベストタイム："+(mem.best!=null?mem.best.toFixed(1)+" びょう":"まだ なし")+"（ぜんぶ いっぱつで できたとき）　あそんだ かいすう："+mem.plays+"かい";
  $("recNote").textContent=info;
  if(!data.length){$("chartBox").innerHTML='<div class="none">まだ きろくが ないよ。ゲームを あそぼう！</div>';return;}
  var W=800,H=400,L=64,R=24,T=24,B=56,pw=W-L-R,ph=H-T-B;
  var mx=0;data.forEach(function(r){if(r.s>mx)mx=r.s;});
  var ymax=Math.min(180,Math.max(70,Math.ceil(mx/10)*10));
  function X(i){return data.length===1?L+pw/2:L+pw*i/(data.length-1);}
  function Y(v){return T+ph*(1-Math.min(v,ymax)/ymax);}
  var g='';
  var step=ymax>100?30:10;if(ymax<=100)step=20;
  for(var v=0;v<=ymax;v+=step){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#eee" stroke-width="2"/><text x="'+(L-8)+'" y="'+(Y(v)+6)+'" text-anchor="end" font-size="18" fill="#7a6f5f">'+v+'</text>';}
  g+='<text x="'+(L-8)+'" y="'+(T-14)+'" text-anchor="end" font-size="16" fill="#7a6f5f">びょう</text>';
  // ⭐3・⭐2 のライン
  function stars(n,xEnd,yB){var o="",sz=24,w=n*(sz+2);for(var q=0;q<n;q++){o+='<image href="'+IMG.icon_star.d+'" x="'+(xEnd-w+q*(sz+2))+'" y="'+(yB-sz+2)+'" width="'+sz+'" height="'+sz+'"/>';}return o;}
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(30)+'" y2="'+Y(30)+'" stroke="#e0a000" stroke-width="4"/><text x="'+(W-R-4)+'" y="'+(Y(30)-8)+'" text-anchor="end" font-size="20" font-weight="700" fill="#b07d00">30びょう</text>'+stars(3,W-R-4-114,Y(30)-8);
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(60)+'" y2="'+Y(60)+'" stroke="#6fa0d8" stroke-width="4"/><text x="'+(W-R-4)+'" y="'+(Y(60)-8)+'" text-anchor="end" font-size="20" font-weight="700" fill="#3a6fb0">60びょう</text>'+stars(2,W-R-4-114,Y(60)-8);
  g+='<line x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="#ccc" stroke-width="2"/><line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'" stroke="#ccc" stroke-width="2"/>';
  // 折れ線
  var pts=data.map(function(r,i){return X(i)+","+Y(r.s);}).join(" ");
  if(data.length>1)g+='<polyline points="'+pts+'" fill="none" stroke="#ef6b5b" stroke-width="4" stroke-linejoin="round"/>';
  var rad=data.length<=30?7:3,lastDay="";
  data.forEach(function(r,i){
    g+='<circle cx="'+X(i)+'" cy="'+Y(r.s)+'" r="'+rad+'" fill="#ef6b5b" stroke="#fff" stroke-width="2"/>';
    var d=new Date(r.t),lab=(d.getMonth()+1)+"/"+d.getDate();
    if(data.length<=10||lab!==lastDay){g+='<text x="'+X(i)+'" y="'+(H-T+8)+'" text-anchor="middle" font-size="17" fill="#7a6f5f">'+lab+'</text>';}
    lastDay=lab;
  });
  $("chartBox").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="タイムの おれせんグラフ">'+g+'</svg>';
}

/* ===== せってい・ルール ===== */
function showHow(){
  dialog('<div class="t">ルール</div><div class="prompt" style="line-height:1.6">10に なる ペアを さがそう。<br>1と9、2と8、3と7、4と6、5と5<br>はやく できると ほしが ふえるよ！</div><div class="row"><button class="btn primary" data-no="1">わかった</button></div>');
}
var resetArm=0,resetTimer=null;
function showGear(){
  resetArm=0;
  dialog('<div class="t">せんせいの せってい</div><div class="prompt" style="line-height:1.6">きろくは この たんまつに ほぞんされます。<br>ほし：'+mem.stars+'　あそんだ かいすう：'+mem.plays+'</div><div class="row"><button class="btn" id="resetBtn" data-reset="1">きろくを ぜんぶ けす</button><button class="btn primary" data-no="1">とじる</button></div>');
}
function doReset(btn){
  if(!resetArm){resetArm=1;btn.textContent="ほんとうに けす？ もういちど おす";clearTimeout(resetTimer);resetTimer=setTimeout(function(){resetArm=0;if(btn&&btn.isConnected)btn.textContent="きろくを ぜんぶ けす";},4000);return;}
  mem={stars:0,owned:[],best:null,plays:0,mute:mem.mute,log:[],pos:{}};save();closeDlg();renderHome();
}

(function(){var m={playBtn:"btn_play",shopBtn:"btn_shop",houseBtn:"btn_house",recBtn:"btn_record",howBtn:"btn_rule",resShopBtn:"btn_shop",resHouseBtn:"btn_house",houseShop:"btn_shop",housePlay:"btn_play"};
  for(var id in m){var el=$(id),d=IMG[m[id]];if(el&&d)el.innerHTML='<img src="'+d.d+'" alt="" draggable="false">';}
  var lg=$("titleLogo");if(lg&&IMG.title_logo)lg.src=IMG.title_logo.d;})();
refreshMute();renderHome();document.body.classList.add("bg-home");
})();
