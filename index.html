<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>かんじ くみたて・えらぶ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --paper:#f5f8f2; --card:#ffffff; --ink:#1f2d27; --sub:#5b6b63; --line:#d5ded7;
  --leaf:#2f7a55; --leaf-soft:#e2f0e7; --kana:#e0621b; --kana-soft:#fdebdf;
  --sky:#2d6aa8; --sky-soft:#e3edf8; --ok:#d23f5a; --miss:#8a94a0; --piece:#2d6aa8; --placed:#1f2d27;
  --shadow:0 2px 0 rgba(31,45,39,.12);
  --kanji:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#16201b; --card:#1f2b25; --ink:#e8efe9; --sub:#a4b3aa; --line:#34443b;
    --leaf:#6cc195; --leaf-soft:#243a2e; --kana:#ff9b5c; --kana-soft:#3a2a1f;
    --sky:#7fb2e8; --sky-soft:#1f3044; --ok:#ff7a93; --miss:#7b8690; --piece:#7fb2e8; --placed:#e8efe9;
    --shadow:0 2px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#16201b; --card:#1f2b25; --ink:#e8efe9; --sub:#a4b3aa; --line:#34443b;
  --leaf:#6cc195; --leaf-soft:#243a2e; --kana:#ff9b5c; --kana-soft:#3a2a1f;
  --sky:#7fb2e8; --sky-soft:#1f3044; --ok:#ff7a93; --miss:#7b8690; --piece:#7fb2e8; --placed:#e8efe9;
  --shadow:0 2px 0 rgba(0,0,0,.35);
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:18px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:0 32px}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--kanji);font-weight:600;font-size:22px;color:var(--leaf);background:none;border:0;cursor:pointer;padding:0}
.brand small{font-family:var(--ui);font-size:13px;color:var(--sub);font-weight:500}
.tools{display:flex;gap:8px}
button{font-family:var(--ui);font-weight:700;color:var(--ink)}
.icon-btn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer}
.icon-btn[aria-pressed="false"]{color:var(--sub)}
button:focus-visible,.piece:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
h1,h2{font-family:var(--kanji);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:30px}
h2{font-size:24px}
.lead{color:var(--sub);margin:4px 0 0}
.screen{display:flex;flex-direction:column;gap:20px;padding-top:8px}

.big-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;box-shadow:var(--shadow);min-height:132px}
.big .t{font-family:var(--kanji);font-size:28px;font-weight:600}
.big .d{font-weight:500;color:var(--sub);font-size:15px}
.big.kumi .t{color:var(--leaf)} .big.erabu .t{color:var(--sky)}
.big.small{min-height:auto}
.big:active{transform:translateY(2px);box-shadow:none}

.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grade{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px 8px;font-size:22px;cursor:pointer;box-shadow:var(--shadow)}
.grade span{display:block;font-size:13px;color:var(--sub);font-weight:500}
.grade:disabled{opacity:.5;cursor:default;box-shadow:none}

.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.unit{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.unit .n{font-size:15px;color:var(--leaf)}
.unit .nm{font-weight:500;font-size:13px;color:var(--sub);line-height:1.4}
.unit .ks{font-family:var(--kanji);font-size:22px;letter-spacing:.08em;line-height:1.3;word-break:break-all}
.unit.all{border-color:var(--leaf);background:var(--leaf-soft)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--leaf);border-radius:99px}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.count{font-variant-numeric:tabular-nums;color:var(--sub);font-weight:700}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--leaf)} .dots i.ng{background:var(--kana)} .dots i.now{outline:2px solid var(--ink);outline-offset:1px}

.sentence{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 20px;font-family:var(--kanji);font-size:clamp(24px,5.4vw,34px);line-height:2.1;text-align:center}
.tgt{color:var(--kana);background:var(--kana-soft);border-radius:8px;padding:0 .12em;font-weight:600}
.tgt.done{color:var(--ink);background:none}
.blank{display:inline-block;min-width:1.6em;border-bottom:3px solid var(--sky);margin-inline:.1em;position:relative;text-align:center;line-height:1.3}
.blank .rd{position:absolute;left:50%;transform:translateX(-50%);bottom:80%;line-height:1;font-size:.45em;color:var(--sky);white-space:nowrap;font-family:var(--ui);font-weight:700}
.blank .fill{color:var(--ink)}

.stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;margin-inline:auto}
.board{position:absolute;background:var(--card);border:3px solid var(--ink);border-radius:6px}
.piece{position:absolute;cursor:grab;touch-action:none;border-radius:8px;transition:left .35s ease,top .35s ease}
.piece.drag{cursor:grabbing;transition:none;z-index:5;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.piece.home{background:var(--sky-soft);outline:2px dashed var(--sky)}
.piece svg{display:block;width:100%;height:100%;overflow:visible}
.piece path{fill:none;stroke:var(--piece);stroke-linecap:round;stroke-linejoin:round}
.piece.set{cursor:default;pointer-events:none}
.piece.set path{stroke:var(--placed)}
.piece.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.choice{background:var(--card);border:3px solid var(--line);border-radius:16px;aspect-ratio:1;max-width:100%;font-family:var(--kanji);font-weight:600;font-size:clamp(40px,11vw,64px);cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.choice:disabled{cursor:default}
.choice.no{opacity:.3}
.choice.yes{border-color:var(--ok);color:var(--ok)}

.feedback{min-height:64px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.msg{font-family:var(--kanji);font-weight:600;font-size:28px}
.msg.ok{color:var(--ok)} .msg.ng{color:var(--kana)}
.maru{width:54px;height:54px;border:6px solid var(--ok);border-radius:50%}
.next{background:var(--leaf);color:#fff;border:0;border-radius:999px;padding:12px 30px;font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
.quit{background:none;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer;color:var(--sub)}

.result{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.score{font-family:var(--kanji);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums}
.score b{color:var(--ok)}
.missed{font-family:var(--kanji);font-size:36px;letter-spacing:.15em}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.tabs{display:flex;gap:8px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 18px;cursor:pointer;font-size:16px}
.tab[aria-selected="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px}
.stat .v{font-size:30px;font-variant-numeric:tabular-nums;font-weight:700}
.stat .l{font-size:14px;color:var(--sub)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--sub);font-weight:500}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td .meter{min-width:90px}
.note{font-size:13px;color:var(--sub)}
footer{margin-top:28px;font-size:12px;color:var(--sub);line-height:1.5}
footer a{color:var(--sub)}
@media (max-width:560px){
  .choices{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grades{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){.piece{transition:none}.piece.shake{animation:none}}
</style>

</div>

const MODES = { kumi: "くみたて", erabu: "えらぶ" };
const PER_ROUND = 10;

/* ---------- データ ---------- */
const GROUPS = [];
DATA.forEach(r => {
  let g = GROUPS[r.m - 1];
  if (!g) g = GROUPS[r.m - 1] = { m: r.m, name: r.u, kanji: [] };
  if (!g.kanji.includes(r.k)) g.kanji.push(r.k);
});
const ALL_KANJI = GROUPS.flatMap(g => g.kanji);

/* ---------- 保存（この端末だけ） ---------- */
const KEY = "kanji-app-v1";
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) {} }
const rec = Object.assign({ kumi: {}, erabu: {}, sound: true }, load());
function mark(mode, k, ok) {
  const r = rec[mode][k] || { t: 0, c: 0, last: null };
  r.t++; if (ok) r.c++; r.last = ok; r.d = Date.now();
  rec[mode][k] = r; save();
}
const done = (mode, k) => !!(rec[mode][k] && rec[mode][k].last);

/* ---------- 音 ---------- */
let ctx = null;
function tone(freq, start, dur, type, vol) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, ctx.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
  o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur + 0.05);
}
function sound(kind) {
  if (!rec.sound) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (kind === "ok") { tone(988, 0, 0.35, "sine", 0.25); tone(784, 0.18, 0.5, "sine", 0.25); }
    else { tone(330, 0, 0.25, "triangle", 0.12); tone(294, 0.14, 0.3, "triangle", 0.1); }
  } catch (e) {}
}
const soundBtn = document.getElementById("soundBtn");
function paintSound() { soundBtn.setAttribute("aria-pressed", rec.sound ? "true" : "false"); soundBtn.textContent = "おと：" + (rec.sound ? "オン" : "オフ"); }
soundBtn.onclick = () => { rec.sound = !rec.sound; save(); paintSound(); };
paintSound();

/* ---------- 画面の小道具 ---------- */
const app = document.getElementById("app");
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => el.append(c instanceof Node ? c : document.createTextNode(c)));
  return el;
}
function show(...nodes) { app.replaceChildren(h("section", { class: "screen" }, ...nodes)); window.scrollTo(0, 0); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function meter(frac) { return h("div", { class: "meter" }, h("i", { style: `width:${Math.round(frac * 100)}%` })); }
document.getElementById("homeBtn").onclick = () => home();

/* ---------- はじめの画面 ---------- */
function home() {
  show(
    h("div", {}, h("h1", {}, "なにを する？"), h("p", { class: "lead" }, "やりたい ものを えらんでね。")),
    h("div", { class: "big-choices" },
      h("button", { class: "big kumi", type: "button", onclick: () => pickGrade("kumi", false) },
        h("span", { class: "t" }, "くみたて"), h("span", { class: "d" }, "ばらばらの ぶひんを うごかして、かんじを つくる")),
      h("button", { class: "big erabu", type: "button", onclick: () => pickGrade("erabu", false) },
        h("span", { class: "t" }, "えらぶ"), h("span", { class: "d" }, "ぶんに あう かんじを 4つの 中から えらぶ")),
      h("button", { class: "big small", type: "button", onclick: pickRetryMode },
        h("span", { class: "t" }, "まちがえた かんじ"), h("span", { class: "d" }, "まちがえた かんじに もういちど チャレンジ")),
      h("button", { class: "big small", type: "button", onclick: () => records("kumi") },
        h("span", { class: "t" }, "きろく"), h("span", { class: "d" }, "どれだけ できたかを 見る"))
    )
  );
}

function pickRetryMode() {
  show(
    h("div", {}, h("h1", {}, "まちがえた かんじ"), h("p", { class: "lead" }, "どちらで チャレンジする？")),
    h("div", { class: "big-choices" },
      ...Object.entries(MODES).map(([m, name]) => {
        const n = ALL_KANJI.filter(k => rec[m][k] && rec[m][k].last === false).length;
        return h("button", { class: "big " + m, type: "button", onclick: () => pickGrade(m, true) },
          h("span", { class: "t" }, name), h("span", { class: "d" }, n ? `まちがえた かんじ：${n}こ` : "まちがえた かんじは ありません"));
      })
    )
  );
}

function pickGrade(mode, retry) {
  const back = h("button", { class: "quit", type: "button", onclick: home }, "もどる");
  show(
    h("div", { class: "qhead" }, h("div", {}, h("h1", {}, "なんねんせいの かんじ？"), h("p", { class: "lead" }, MODES[mode] + (retry ? "・まちがえた かんじ" : ""))), back),
    h("div", { class: "grades" },
      [1, 2, 3, 4, 5, 6].map(g => h("button", { class: "grade", type: "button", disabled: g !== 3,
        onclick: () => retry ? startRetry(mode) : pickUnit(mode) }, `${g}ねんせい`, h("span", {}, g === 3 ? "200字" : "じゅんびちゅう")))
    )
  );
}

function pickUnit(mode) {
  const doneIn = ks => ks.filter(k => done(mode, k)).length;
  show(
    h("div", { class: "qhead" }, h("div", {}, h("h1", {}, "どこを べんきょうする？"), h("p", { class: "lead" }, `3ねんせい・${MODES[mode]}`)),
      h("button", { class: "quit", type: "button", onclick: () => pickGrade(mode, false) }, "もどる")),
    h("div", { class: "units" },
      h("button", { class: "unit all", type: "button", onclick: () => start(mode, ALL_KANJI, "ぜんぶの たんげん") },
        h("span", { class: "n" }, "ぜんぶの たんげん"), h("span", { class: "nm" }, `3ねんせいの 200字から 10もん`),
        meter(doneIn(ALL_KANJI) / ALL_KANJI.length)),
      GROUPS.map(g => h("button", { class: "unit", type: "button", onclick: () => start(mode, g.kanji, `まとまり${g.m}`) },
        h("span", { class: "n" }, `まとまり${g.m}`), h("span", { class: "nm" }, g.name),
        h("span", { class: "ks" }, g.kanji.join("")), meter(doneIn(g.kanji) / g.kanji.length)))
    )
  );
}

/* ---------- 出題 ---------- */
let round = null;
function buildQueue(mode, kanjiList) {
  const fresh = shuffle(kanjiList.filter(k => !done(mode, k)));
  const known = shuffle(kanjiList.filter(k => done(mode, k)));
  return fresh.concat(known).slice(0, PER_ROUND).map(k => {
    const rows = DATA.filter(r => r.k === k);
    return rows[Math.floor(Math.random() * rows.length)];
  });
}
function start(mode, kanjiList, label) {
  round = { mode, label, list: kanjiList, queue: buildQueue(mode, kanjiList), i: 0, res: [] };
  ask();
}
function startRetry(mode) {
  const list = ALL_KANJI.filter(k => rec[mode][k] && rec[mode][k].last === false);
  if (!list.length) {
    show(h("div", { class: "result" }, h("div", { class: "msg ok" }, "まちがえた かんじは ありません"),
      h("div", { class: "row" }, h("button", { class: "next", type: "button", onclick: home }, "はじめに もどる"))));
    return;
  }
  start(mode, list, "まちがえた かんじ");
}

function qhead() {
  return h("div", { class: "qhead" },
    h("div", { class: "count" }, `${round.label}・${MODES[round.mode]}　${round.i + 1} / ${round.queue.length}もんめ`),
    h("div", { class: "dots" }, round.queue.map((_, i) => h("i", { class: i < round.res.length ? (round.res[i] ? "ok" : "ng") : (i === round.i ? "now" : "") }))),
    h("button", { class: "quit", type: "button", onclick: finish }, "おわる"));
}
function feedbackArea() { return h("div", { class: "feedback", "aria-live": "polite" }); }
function correctUI(fb, ok) {
  fb.replaceChildren(h("span", { class: "maru" }), h("span", { class: "msg ok" }, "せいかい！"),
    h("button", { class: "next", type: "button", onclick: nextQ }, round.i + 1 < round.queue.length ? "つぎへ" : "けっかを 見る"));
  round.res.push(ok);
  mark(round.mode, round.queue[round.i].k, ok);
  sound("ok");
  fb.querySelector(".next").focus({ preventScroll: true });
}
function nextQ() { round.i++; round.i < round.queue.length ? ask() : finish(); }
function ask() { round.mode === "kumi" ? askKumi(round.queue[round.i]) : askErabu(round.queue[round.i]); }

/* ---------- えらぶ ---------- */
function askErabu(q) {
  const [pre, post] = q.q2.split("〔　〕");
  const fill = h("span", { class: "fill" }, "　");
  const blank = h("span", { class: "blank" }, h("span", { class: "rd" }, q.b), fill);
  const fb = feedbackArea();
  let missed = false;
  const buttons = shuffle([q.k, ...q.w]).map(c => h("button", { class: "choice", type: "button", onclick: e => {
    const b = e.currentTarget;
    if (c === q.k) {
      fill.textContent = c; b.classList.add("yes");
      buttons.forEach(x => x.disabled = true);
      correctUI(fb, !missed);
    } else {
      missed = true; b.classList.add("no"); b.disabled = true; sound("ng");
      fb.replaceChildren(h("span", { class: "msg ng" }, "もういちど"));
    }
  } }, c));
  show(qhead(), h("div", { class: "sentence" }, pre, blank, post), h("div", { class: "choices" }, buttons), fb);
}

/* ---------- くみたて ---------- */
function measure(paths) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 109 109");
  svg.style.cssText = "position:absolute;left:-9999px;top:0;width:109px;height:109px;visibility:hidden";
  const g = document.createElementNS(ns, "g");
  paths.forEach(d => { const p = document.createElementNS(ns, "path"); p.setAttribute("d", d); g.append(p); });
  svg.append(g); document.body.append(svg);
  const b = g.getBBox(); svg.remove();
  const pad = 3;
  return { x: b.x - pad, y: b.y - pad, w: b.width + pad * 2, h: b.height + pad * 2, n: paths.length };
}
function pieceSvg(paths, box) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `${box.x} ${box.y} ${box.w} ${box.h}`);
  paths.forEach(d => { const p = document.createElementNS(ns, "path"); p.setAttribute("d", d); p.setAttribute("stroke-width", "4"); svg.append(p); });
  return svg;
}

function askKumi(q) {
  const parts = PARTS[q.k];
  const segs = q.q1.split(/【|】/); // [前, ひらがな, 後]
  const tgt = h("span", { class: "tgt" }, segs[1]);
  const fb = feedbackArea();
  const stage = h("div", { class: "stage" });
  show(qhead(), h("div", { class: "sentence" }, segs[0], tgt, segs[2]),
    h("p", { class: "note", style: "text-align:center;margin:0" }, "いろの ついた ところの かんじを、下の ぶひんを 四角に うごかして つくろう。"),
    stage, fb);

  const width = Math.min(stage.parentElement.clientWidth, 720);
  const boardPx = Math.min(width - 8, 300);
  const s = boardPx / 109;
  const boxes = parts.map(measure);
  // 広い画面：四角は左、部品置き場は右。せまい画面：部品置き場は四角の下
  const wide = width >= 560;
  const bLeft = wide ? 0 : (width - boardPx) / 2, bTop = 4;
  const board = h("div", { class: "board", style: `left:${bLeft}px;top:${bTop}px;width:${boardPx}px;height:${boardPx}px` });
  stage.append(board);

  const gap = 18;
  const trayX = wide ? boardPx + 36 : 0, trayW = wide ? width - trayX : width;
  const trayTop = wide ? bTop : bTop + boardPx + 28;
  const order = shuffle(parts.map((_, i) => i));
  let x = 0, y = trayTop, rowH = 0; const homes = [];
  const rows = [[]];
  order.forEach(i => {
    const w = boxes[i].w * s, hh = boxes[i].h * s;
    if (x > 0 && x + w > trayW) { rows.push([]); x = 0; y += rowH + gap; rowH = 0; }
    homes[i] = { x, y }; rows[rows.length - 1].push(i);
    x += w + gap; rowH = Math.max(rowH, hh);
  });
  rows.forEach(r => { // 行ごとに中央へ
    const used = r.reduce((a, i) => a + boxes[i].w * s, 0) + gap * (r.length - 1);
    const off = trayX + (trayW - used) / 2; r.forEach(i => homes[i].x += off);
  });
  stage.style.width = width + "px";
  stage.style.height = Math.max(bTop + boardPx, y + rowH) + 8 + "px";

  const slots = boxes.map(b => ({ x: bLeft + b.x * s, y: bTop + b.y * s, b, filled: false }));
  let wrongs = 0, placed = 0;
  const same = (a, b) => a.n === b.n && Math.abs(a.w - b.w) < 3 && Math.abs(a.h - b.h) < 3;

  parts.forEach((paths, i) => {
    const el = h("div", { class: "piece home", tabindex: "0", role: "button", "aria-label": `ぶひん ${i + 1}`,
      style: `left:${homes[i].x}px;top:${homes[i].y}px;width:${boxes[i].w * s}px;height:${boxes[i].h * s}px` });
    el.append(pieceSvg(paths, boxes[i]));
    stage.append(el);
    let sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
    el.addEventListener("pointerdown", e => {
      e.preventDefault(); el.setPointerCapture(e.pointerId); dragging = true;
      el.classList.add("drag"); el.classList.remove("home");
      sx = e.clientX; sy = e.clientY; ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
    });
    el.addEventListener("pointermove", e => {
      if (!dragging) return;
      el.style.left = ox + e.clientX - sx + "px"; el.style.top = oy + e.clientY - sy + "px";
    });
    const drop = () => {
      if (!dragging) return; dragging = false; el.classList.remove("drag");
      const px = parseFloat(el.style.left), py = parseFloat(el.style.top);
      const tol = boardPx * 0.15;
      const hit = slots.find((sl, j) => !sl.filled && (j === i || same(sl.b, boxes[i])) && Math.hypot(px - sl.x, py - sl.y) < tol);
      if (hit) {
        hit.filled = true; placed++;
        el.style.left = hit.x + "px"; el.style.top = hit.y + "px";
        el.classList.add("set"); el.removeAttribute("tabindex");
        if (placed === parts.length) {
          tgt.textContent = q.k; tgt.classList.add("done");
          correctUI(fb, wrongs < 3);
        }
        return;
      }
      const cx = px + boxes[i].w * s / 2, cy = py + boxes[i].h * s / 2;
      const onBoard = cx > bLeft && cx < bLeft + boardPx && cy > bTop && cy < bTop + boardPx;
      if (onBoard) { wrongs++; sound("ng"); }
      el.style.left = homes[i].x + "px"; el.style.top = homes[i].y + "px";
      el.classList.add("home");
      if (onBoard) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
    };
    el.addEventListener("pointerup", drop);
    el.addEventListener("pointercancel", drop);
  });
}

/* ---------- けっか ---------- */
function finish() {
  if (!round || !round.res.length) { home(); return; }
  const ok = round.res.filter(Boolean).length, n = round.res.length;
  const missed = round.queue.slice(0, n).filter((q, i) => !round.res[i]).map(q => q.k);
  const again = () => start(round.mode, round.list, round.label);
  show(h("div", { class: "result" },
    h("h1", {}, "けっか"),
    h("div", { class: "score" }, `${n}もん中 `, h("b", {}, `${ok}もん`), " せいかい"),
    missed.length ? [h("p", { class: "lead" }, "まちがえた かんじ"), h("div", { class: "missed" }, missed.join(""))] : h("p", { class: "msg ok" }, "ぜんぶ せいかい！"),
    h("div", { class: "row" },
      h("button", { class: "next", type: "button", onclick: again }, "もういちど"),
      h("button", { class: "quit", type: "button", onclick: home }, "はじめに もどる"))
  ));
}

/* ---------- きろく ---------- */
function records(mode) {
  const stat = ks => {
    let t = 0, c = 0, d = 0;
    ks.forEach(k => { const r = rec[mode][k]; if (r) { t += r.t; c += r.c; if (r.last) d++; } });
    return { t, c, d, rate: t ? Math.round(c / t * 100) + "%" : "−" };
  };
  const all = stat(ALL_KANJI);
  show(
    h("div", { class: "qhead" }, h("h1", {}, "きろく"), h("button", { class: "quit", type: "button", onclick: home }, "もどる")),
    h("div", { class: "tabs", role: "tablist" }, Object.entries(MODES).map(([m, name]) =>
      h("button", { class: "tab", role: "tab", type: "button", "aria-selected": m === mode ? "true" : "false", onclick: () => records(m) }, name))),
    h("div", { class: "summary" },
      h("div", { class: "stat" }, h("div", { class: "v" }, `${all.d} / ${ALL_KANJI.length}`), h("div", { class: "l" }, "できた かんじ（3ねんせい ぜんたい）"), meter(all.d / ALL_KANJI.length)),
      h("div", { class: "stat" }, h("div", { class: "v" }, all.rate), h("div", { class: "l" }, `せいかいりつ（${all.c} / ${all.t}かい）`))
    ),
    h("div", { class: "tbl" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, "まとまり"), h("th", {}, "できた"), h("th", {}, ""), h("th", {}, "せいかいりつ"))),
      h("tbody", {}, GROUPS.map(g => { const st = stat(g.kanji);
        return h("tr", {}, h("td", {}, `まとまり${g.m}`), h("td", { class: "num" }, `${st.d} / ${g.kanji.length}`),
          h("td", {}, meter(st.d / g.kanji.length)), h("td", { class: "num" }, st.rate)); }))
    )),
    h("p", { class: "note" }, "「できた」は、その かんじの いちばん さいきんの こたえが せいかいの ものです。くみたてでは、ぶひんが 3かい いじょう もどると まちがいに なります。")
  );
}

home();
</script>

</html>
